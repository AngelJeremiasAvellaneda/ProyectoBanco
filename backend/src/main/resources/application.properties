# ─────────────────────────────────────────────
# BancoAndino — Spring Boot Backend
# ─────────────────────────────────────────────

spring.application.name=homebanking-backend
server.port=8080

# ── Base de datos — Supabase PostgreSQL (Session Pooler) ──────
# Direct Connection no disponible en Free tier.
# Session Pooler (puerto 5432) con ddl-auto=none para evitar
# que Hibernate inspeccione metadatos y cierre la conexión.

spring.datasource.url=jdbc:postgresql://localhost:5432/db_bcp
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP ──────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
# Supabase Session Pooler requiere autocommit=true
spring.datasource.hikari.auto-commit=true

# ── JPA / Hibernate ───────────────────────────────────────────
# none: NO inspecciona ni modifica el schema
# Las tablas ya existen creadas por los scripts SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Desactiva validacion de schema al iniciar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Forzar dialecto explícitamente (evita consulta a metadata)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────
app.jwt.secret=MiClaveSecretaSuperSeguraParaBancoAndino2026XYZ
app.jwt.expiration-ms=86400000

# ── Supabase URL (para validar JWTs RS256) ────
supabase.url=https://eimjentsvgnmpxkxbjgf.supabase.co

# ── CORS ──────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging ───────────────────────────────────
logging.level.pe.bancoconfianza=DEBUG
logging.level.org.springframework.security=WARN

# ── Profile ───────────────────────────────────
spring.profiles.active=dev
