# ─────────────────────────────────────────────────────────────
# Perfil DEV — H2 en memoria (no requiere PostgreSQL ni Supabase)
# Uso: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# ─────────────────────────────────────────────────────────────

# ── H2 en memoria ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:homebanking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA con H2 ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Consola H2 (http://localhost:8080/h2-console) ─────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Datos de prueba ───────────────────────────────────────────
# Los datos se cargan via DataInitializer.java (CommandLineRunner)
# que se ejecuta DESPUÉS de que Hibernate crea las tablas.
spring.sql.init.mode=never
